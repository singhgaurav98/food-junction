<svg viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Food Junction kitchen and thali illustration">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#F4C542"/>
      <stop offset="60%" stop-color="#E8A317"/>
      <stop offset="100%" stop-color="#7A1B1B"/>
    </radialGradient>
  </defs>
  <rect width="600" height="460" rx="28" fill="url(#bg)"/>

  <!-- big thali platter -->
  <circle cx="300" cy="235" r="150" fill="#FBF3E3" stroke="#5A1616" stroke-width="6"/>
  <circle cx="300" cy="235" r="150" fill="none" stroke="#E8A317" stroke-opacity="0.5" stroke-width="3"/>
  <circle cx="300" cy="235" r="58" fill="#7A1B1B" stroke="#5A1616" stroke-width="5"/>
  <circle cx="300" cy="235" r="40" fill="#C8562B"/>

  <!-- small katoris around rim -->
  <g stroke="#5A1616" stroke-width="4">
    <circle cx="180" cy="150" r="30" fill="#F4C542"/>
    <circle cx="420" cy="150" r="30" fill="#C8562B"/>
    <circle cx="150" cy="280" r="26" fill="#C8562B"/>
    <circle cx="450" cy="280" r="26" fill="#F4C542"/>
    <circle cx="220" cy="340" r="24" fill="#7A1B1B"/>
    <circle cx="380" cy="340" r="24" fill="#E8A317"/>
  </g>

  <!-- steam -->
  <g stroke="#FBF3E3" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M270 130c-10-16 10-20 0-40"/>
    <path d="M300 122c-10-16 10-20 0-40"/>
    <path d="M330 130c-10-16 10-20 0-40"/>
  </g>

  <!-- chef hat badge -->
  <g transform="translate(462,60)">
    <circle cx="0" cy="0" r="46" fill="#FBF3E3" stroke="#5A1616" stroke-width="4"/>
    <path d="M-18 12 L-18 -6 Q-18 -22 0 -22 Q18 -22 18 -6 L18 12 Z" fill="#7A1B1B"/>
    <rect x="-20" y="10" width="40" height="10" rx="3" fill="#4A0E0E"/>
  </g>
</svg>